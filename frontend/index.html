<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DebitLens</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --side: #123C32;
            --side2: #205747;
            --bg: #F7F5EE;
            --card: #fff;
            --mint: #A7F3D0;
            --sage: #D1FAE5;
            --warn: #F59E0B;
            --bad: #E76F51;
            --tx: #242B27;
            --mu: #78847C;
            --bd: #E2E8E4;
            --bar: #205747;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        :root[data-theme="dark"] {
            --bg: #0E2620;
            --card: #163D33;
            --tx: #EAF3EE;
            --mu: #9DB3A8;
            --bd: #2A5547;
            --sage: #1d4a3d;
            --bar: #A7F3D0;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.5 Inter, system-ui, sans-serif
        }

        .app {
            display: grid;
            grid-template-columns: 230px 1fr;
            min-height: 100vh
        }

        aside {
            background: var(--side);
            color: #fff;
            padding: 20px 12px;
            position: sticky;
            top: 0;
            height: 100vh
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            padding: 0 10px 2px
        }

        .logo small {
            display: block;
            font-weight: 500;
            font-size: 10px;
            color: #9FC9B6;
            letter-spacing: .06em
        }

        nav {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        nav a {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #CFE5DA;
            text-decoration: none;
            font-weight: 500
        }

        nav a.on {
            background: var(--side2);
            color: #fff
        }

        nav a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--warn);
            outline-offset: 2px
        }

        main {
            padding: 26px;
            max-width: 1120px;
            width: 100%
        }

        h1 {
            font-size: 28px;
            margin: 0 0 4px;
            letter-spacing: -.02em
        }

        .sub {
            color: var(--mu);
            margin: 0 0 20px
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start
        }

        .demo {
            background: var(--sage);
            color: #123C32;
            border-radius: 99px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(18, 60, 50, .06)
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 15px
        }

        .g4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 14px
        }

        .g2 {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 14px;
            margin-bottom: 14px
        }

        .kpi b {
            font-size: 28px;
            display: block;
            letter-spacing: -.02em
        }

        .kpi span {
            color: var(--mu);
            font-size: 13px
        }

        .kpi.hero {
            background: var(--side);
            border-color: var(--side);
            color: #fff
        }

        .kpi.hero span {
            color: #BFE3D3
        }

        .tw {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px
        }

        th,
        td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--bd);
            white-space: nowrap
        }

        th {
            color: var(--mu);
            font-weight: 500;
            cursor: pointer
        }

        tr.r {
            cursor: pointer
        }

        tr.r:hover {
            background: var(--sage)
        }

        .pill {
            padding: 2px 9px;
            border-radius: 99px;
            font-size: 12px;
            background: var(--mint);
            color: #123C32;
            font-weight: 600
        }

        .pill.rev {
            background: #FDE9B8;
            color: #6b4300
        }

        .pill.can {
            background: #E2E8E4;
            color: #4b564f
        }

        .av {
            display: inline-grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            margin-right: 8px;
            vertical-align: middle
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--bd);
            align-items: center
        }

        .row:last-child {
            border: 0
        }

        input[type=search] {
            width: 100%;
            max-width: 340px;
            padding: 9px 12px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            background: var(--card);
            color: var(--tx);
            font: inherit
        }

        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0
        }

        button,
        .btn {
            font: inherit;
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            font-weight: 500
        }

        button.on,
        button.pri {
            background: var(--side);
            color: #fff;
            border-color: var(--side)
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        details.al {
            border-left: 5px solid var(--warn);
            margin-bottom: 12px
        }

        details.al.bad {
            border-left-color: var(--bad)
        }

        details.al.ok {
            border-left-color: var(--side2)
        }

        summary {
            cursor: pointer;
            font-weight: 600;
            list-style: none
        }

        summary span {
            color: var(--mu);
            font-weight: 400;
            display: block
        }

        .ev {
            margin-top: 10px;
            background: var(--bg);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px
        }

        #dr {
            position: fixed;
            top: 0;
            right: 0;
            width: min(400px, 100%);
            height: 100%;
            background: var(--card);
            border-left: 1px solid var(--bd);
            padding: 20px;
            overflow: auto;
            transform: translateX(105%);
            transition: transform .2s;
            z-index: 20;
            box-shadow: -8px 0 24px rgba(18, 60, 50, .15)
        }

        #dr.o {
            transform: none
        }

        .step {
            display: flex;
            gap: 8px;
            padding: 6px 0
        }

        pre {
            background: var(--bg);
            padding: 10px;
            border-radius: 8px;
            overflow: auto;
            font-size: 12px;
            max-height: 240px
        }

        svg text {
            font-family: Inter, sans-serif
        }

        .node {
            cursor: pointer
        }

        @media(max-width:800px) {
            .app {
                grid-template-columns: 1fr
            }

            aside {
                height: auto;
                position: static;
                padding: 12px
            }

            nav {
                flex-direction: row;
                overflow-x: auto;
                margin-top: 10px
            }

            nav a {
                white-space: nowrap
            }

            .g2 {
                grid-template-columns: 1fr
            }

            main {
                padding: 16px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            #dr {
                transition: none
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside>
            <div class="logo">DebitLens<small>FINANCIAL INTELLIGENCE</small></div>
            <nav id="nav"></nav>
        </aside>
        <main id="m"></main>
    </div>
    <div id="dr" role="dialog" aria-label="Merchant details"></div>
    <script>
        const fmt = n => Math.round(n).toLocaleString('en-IN'), D = 864e5;
        function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
        const R = rng(7), MO = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
        /* hand-built alias reference */
        const ALIAS = [['NETFLIX', 'Netflix', 'Entertainment'], ['SPOTIFY', 'Spotify', 'Entertainment'], ['AMZNPRIME', 'Amazon Prime', 'Entertainment'], ['GOOGLEONE', 'Google One', 'Cloud & Storage'], ['APPLECOMBILL', 'Apple iCloud', 'Cloud & Storage'], ['ADOBE', 'Adobe Creative Cloud', 'Productivity'], ['HOTSTAR', 'Disney+ Hotstar', 'Entertainment'], ['CULTFIT', 'Cult.fit', 'Health'], ['LICPREMIUM', 'LIC Premium', 'Insurance'], ['JIOFIBER', 'JioFiber', 'Utilities'], ['SWIGGY', 'Swiggy', 'Food'], ['AMAZONPAY', 'Amazon Pay', 'Shopping'], ['UBER', 'Uber', 'Travel']];
        const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
        const bg = s => { const o = new Set(); for (let i = 0; i < s.length - 1; i++)o.add(s.slice(i, i + 2)); return o };
        function dice(a, b) { const x = bg(a), y = bg(b); let c = 0; x.forEach(k => y.has(k) && c++); return 2 * c / (x.size + y.size || 1) }
        function decode(d) {
            const n = norm(d); let best = null;
            for (const a of ALIAS) {
                if (n.includes(a[0])) return { name: a[1], cat: a[2], conf: .98 };
                for (let i = 0; i + a[0].length <= n.length; i++) { const s = dice(n.substr(i, a[0].length), a[0]); if (!best || s > best.s) best = { s, a } }
            }
            return best && best.s >= .6 ? { name: best.a[1], cat: best.a[2], conf: +(.5 + best.s / 2).toFixed(2) } : { name: d, cat: 'Unknown', conf: .3 }
        }
        /* synthetic statement */
        const DEF = [
            { d: 'NETFLIX.COM*MUM', mech: 'Card e-mandate', day: 28, amt: i => i >= 7 ? 649 : 519, use: '2026-10-26' },
            { d: 'SPOTIFY INDIA', mech: 'UPI AutoPay', day: 27, amt: () => 119, use: '2026-10-30' },
            { d: 'AMZNPRIME*IND', mech: 'Card e-mandate', day: 26, amt: () => 299, use: '2026-10-20' },
            { d: 'GOOGLE*ONE', mech: 'UPI AutoPay', day: 11, amt: i => i == 10 ? 0 : 130, on: i => i >= 10, use: '2026-10-28' },
            { d: 'APPLE.COM/BILL', mech: 'App Store', day: 24, amt: () => 299, use: '2026-10-31' },
            { d: 'ADOBE *CREATIVE CLD', mech: 'NACH', day: 12, amt: () => 1675, use: '2026-07-20' },
            { d: 'HOTSTAR*DISNEY', mech: 'UPI AutoPay', day: 15, jit: 4, amt: () => 299, use: '2026-10-18' },
            { d: 'CULTFIT 8821', mech: 'Direct merchant billing', day: 5, jit: 3, amt: () => 1500, use: '2026-10-29' },
            { d: 'LIC PREMIUM NACH', mech: 'NACH', day: 20, amt: () => 3250, on: i => i % 3 == 1, use: '2026-10-01' },
            { d: 'JIOFIBER 99120', mech: 'Direct merchant billing', day: 9, amt: () => 999, use: '2026-10-31' }];
        const tx = [], USE = {};
        DEF.forEach(m => {
            const nm = decode(m.d).name; USE[nm] = m.use; for (let i = 0; i < 12; i++) {
                if (m.on && !m.on(i)) continue;
                const j = m.jit ? Math.round((R() * 2 - 1) * m.jit) : 0, dt = new Date(Date.UTC(2025, 10 + i, m.day + j));
                tx.push({ dt, desc: m.d == 'NETFLIX.COM*MUM' && i % 4 == 2 ? 'NETFLX.COM*MUM' : m.d, amt: m.amt(i), mech: m.mech, mi: i })
            }
        });
        [['SWIGGY*ORDER 4471', 30, 150, 700], ['AMAZON PAY INDIA', 9, 200, 3000], ['UBER INDIA TRIP', 12, 120, 600]].forEach(([d, n, lo, hi]) => { for (let k = 0; k < n; k++)tx.push({ dt: new Date(Date.UTC(2025, 10, 1) + Math.floor(R() * 364) * D), desc: d, amt: Math.round(lo + R() * (hi - lo)), mech: 'Card payment', mi: 0 }) });
        tx.sort((a, b) => a.dt - b.dt);
        /* detection */
        const G = {}; tx.forEach(t => { const g = decode(t.desc); t.m = g.name; t.cat = g.cat; t.conf = g.conf; (G[g.name] = G[g.name] || []).push(t) });
        const recs = [], rej = [];
        const med = a => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)] };
        Object.entries(G).forEach(([n, a]) => {
            const iv = a.slice(1).map((t, i) => (t.dt - a[i].dt) / D), md = iv.length ? med(iv) : 0, trial = a[0].amt <= 1;
            const ok = (a.length >= 3 || (trial && a.length >= 2)) && iv.every(x => Math.abs(x - md) / md <= .3);
            if (!ok) { rej.push({ n, c: a.length }); return }
            const py = md <= 10 ? 52 : md <= 40 ? 12 : md <= 100 ? 4 : 1, paid = a.filter(t => t.amt > 1), cur = a[a.length - 1].amt, prev = paid.length > 1 ? paid[paid.length - 2].amt : cur;
            const r = { n, cat: a[0].cat, mech: a[a.length - 1].mech, freq: py == 52 ? 'Weekly' : py == 12 ? 'Monthly' : py == 4 ? 'Quarterly' : 'Yearly', py, cur, prev, a, descs: [...new Set(a.map(t => t.desc))], conf: a.reduce((s, t) => s + t.conf, 0) / a.length, last: a[a.length - 1].dt, an: [] };
            let j = paid.length - 1; while (j >= 0 && paid[j].amt == cur) j--; if (j >= 0 && cur > paid[j].amt * 1.03) { const pv = paid[j].amt; r.an.push({ t: 'price', prev: pv, cur, pct: Math.round((cur / pv - 1) * 100), at: paid[j + 1].dt }) }
            if (trial && a.length > 1) r.an.push({ t: 'trial', s: a[0].dt, p: a[1].dt });
            const u = USE[n] ? new Date(USE[n]) : null;
            if (u && (r.last - u) / D > 60) { const after = a.filter(t => t.dt > u); r.an.push({ t: 'idle', u, n: after.length, w: after.reduce((s, t) => s + t.amt, 0), days: Math.round((r.last - u) / D) }) }
            r.annual = cur * py; recs.push(r)
        });
        recs.forEach(r => { r.save = 0; r.an.forEach(x => { if (x.t == 'idle') r.save = r.annual; else if (x.t == 'price' && !r.save) r.save = (x.cur - x.prev) * r.py }) });
        const total = recs.reduce((s, r) => s + r.annual, 0), savings = recs.reduce((s, r) => s + r.save, 0);
        const monthly = MO.map((_, i) => recs.reduce((s, r) => s + r.a.filter(t => t.mi == i).reduce((q, t) => q + t.amt, 0), 0));
        /* cancellation guides */
        const CG = {
            'UPI AutoPay': { where: 'Your UPI app (Google Pay, PhonePe, Paytm)', steps: ['Open the UPI app and go to Autopay or Mandates', 'Select the merchant’s mandate', 'Choose Pause or Revoke and enter your UPI PIN', 'Cancel inside the merchant’s own app too, so it stops asking'], esc: 'If the merchant still charges, dispute the debit with your bank in writing, then escalate to the bank’s nodal officer and the RBI Integrated Ombudsman (cms.rbi.org.in).' },
            'Card e-mandate': { where: 'Your bank app or net banking, plus the merchant account', steps: ['Cancel the plan in the merchant’s account settings', 'In your bank app, open Cards, then Standing instructions or e-mandates, and remove it', 'Note the cancellation reference number', 'Check your next pre-debit notification does not arrive'], esc: 'If a charge goes through after cancelling, raise a dispute with your card issuer and attach the reference number. Block the card for that merchant if it repeats.' },
            'NACH': { where: 'Your bank branch or net banking mandate management', steps: ['Find the mandate reference (UMRN) on your statement or mandate email', 'Submit a mandate cancellation request in net banking or at the branch', 'Send the merchant a written cancellation notice', 'Keep the acknowledgement copy'], esc: 'If the merchant debits again, file a complaint with the bank’s grievance cell citing the UMRN, then escalate to the RBI Integrated Ombudsman.' },
            'App Store': { where: 'Apple ID or Google Play subscriptions', steps: ['On iPhone open Settings, tap your name, then Subscriptions', 'On Android open Play Store, then Payments and subscriptions', 'Select the plan and choose Cancel', 'Confirm the end date shown on screen'], esc: 'For wrong charges, request a refund at reportaproblem.apple.com or through Google Play support.' },
            'Direct merchant billing': { where: 'The merchant’s customer care or account page', steps: ['Request cancellation in writing by email or app', 'Ask for a ticket number and a confirmation of the end date', 'Ask your bank to stop the debit instruction if one exists', 'Check the next statement for a zero charge'], esc: 'If there is no reply within 7 days, resend with the ticket number, then file a complaint on the National Consumer Helpline (1915).' }
        };
        /* state */
        const S = { q: '', f: 'All', k: 'amt', dir: -1, g: 0, done: {}, can: {}, cy: false };
        const NAV = [['overview', '◧', 'Overview'], ['recurring', '⟳', 'Recurring Payments'], ['anomalies', '⚠', 'Anomaly Detection'], ['graph', '⌘', 'Payment Graph'], ['annual', '▮', 'Annual Spending']];
        const COL = ['#E76F51', '#1DB954', '#F59E0B', '#205747', '#8A6F4D', '#C9893B', '#4C8C6B', '#B5651D', '#6B8F71', '#A0522D'];
        const st = r => S.can[r.n] ? 'Cancelled' : r.an.length ? 'Review' : 'Active';
        const pill = r => `<span class="pill ${st(r) == 'Review' ? 'rev' : st(r) == 'Cancelled' ? 'can' : ''}">${st(r)}</span>`;
        const av = (r, i) => `<span class="av" style="background:${COL[i % COL.length]}">${r.n[0]}</span>`;
        const dt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
        const head = (t, s) => `<div class="top"><div><h1>${t}</h1><p class="sub">${s}</p></div><span class="demo">Demo mode · synthetic data</span></div>`;
        function bars(v, l, h = 170) { const w = 600, mx = Math.max(...v, 1), bw = w / v.length; return `<svg viewBox="0 0 ${w} ${h + 22}" width="100%" role="img" aria-label="Monthly recurring spend">` + v.map((x, i) => { const bh = x / mx * h; return `<rect x="${i * bw + 6}" y="${h - bh}" width="${bw - 12}" height="${bh}" rx="4" fill="var(--bar)"><title>${l[i]}: ₹${fmt(x)}</title></rect><text x="${i * bw + bw / 2}" y="${h + 15}" font-size="11" text-anchor="middle" fill="var(--mu)">${l[i]}</text>` }).join('') + '</svg>' }
        function alerts() { const o = []; recs.forEach((r, i) => r.an.forEach(x => o.push({ r, i, x }))); return o }
        const label = { price: 'Price increase detected', trial: 'Trial converted to paid', idle: 'Unused subscription detected' };
        /* pages */
        const P = {
            overview() {
                const al = alerts(); return head('Your money. Your control.', 'Recurring payments found in 12 months of statements.') +
                    `<div class="g4"><div class="card kpi hero"><b>₹${fmt(total)}</b><span>Annual commitments</span></div><div class="card kpi"><b>₹${fmt(savings)}</b><span>Potential yearly savings</span></div><div class="card kpi"><b>${recs.length}</b><span>Recurring payments</span></div><div class="card kpi"><b>${recs.filter(r => r.mech != 'App Store' && !S.can[r.n]).length}</b><span>Active mandates</span></div></div>
<div class="g2"><div class="card"><h3>Monthly recurring spend</h3>${bars(monthly, MO)}</div>
<div class="card"><h3>Payment intelligence · ${al.length} need attention</h3>${al.map(a => `<div class="row"><span>${a.r.n}<br><span class="sub" style="margin:0">${label[a.x.t]}${a.x.t == 'price' ? ' +' + a.x.pct + '%' : ''}</span></span><button onclick="location.hash='anomalies'">View</button></div>`).join('')}</div></div>
<div class="card"><h3>Checked and rejected as irregular</h3><p class="sub" style="margin:0">${rej.map(x => x.n + ' (' + x.c + ' payments)').join(', ')}. Their dates and amounts don’t repeat, so they aren’t commitments.</p></div>`
            },
            recurring() {
                return head('Recurring Payments', 'Every commitment found, with the bank text decoded.') +
                    `<input type="search" placeholder="Search merchant or descriptor" aria-label="Search" value="${S.q}" oninput="S.q=this.value;rows()">
<div class="chips">${['All', 'Active', 'Review', 'Cancelled'].map(f => `<button class="${S.f == f ? 'on' : ''}" onclick="S.f='${f}';go()">${f}</button>`).join('')}</div>
<div class="card tw"><table><thead><tr><th onclick="srt('n')">Merchant</th><th>Bank descriptor</th><th>Match</th><th onclick="srt('amt')">Amount</th><th>Frequency</th><th>Mechanism</th><th onclick="srt('last')">Last charged</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>`},
            anomalies() {
                const al = alerts(); return head('Anomaly Detection', 'Each alert shows the transactions behind it.') + (al.length ? al.map(({ r, x }) => {
                    if (x.t == 'price') return `<details class="al bad card"><summary>Silent price increase · ${r.n}<span>₹${x.prev} → ₹${x.cur} (+${x.pct}%) from ${dt(x.at)}</span></summary><div class="ev">Previous charge ₹${x.prev}, current ₹${x.cur}. Extra cost: ₹${fmt((x.cur - x.prev) * r.py)} a year. Mandate: ${r.mech}. The merchant is not required to ask again if the mandate limit allows it, so check your mandate cap.</div></details>`;
                    if (x.t == 'trial') return `<details class="al card"><summary>Trial converted to paid · ${r.n}<span>Trial started ${dt(x.s)}, first paid charge ${dt(x.p)}</span></summary><div class="ev">Trial entry: ₹0 on ${dt(x.s)}. First paid transaction: ₹${r.cur} on ${dt(x.p)}. It now costs ₹${fmt(r.annual)} a year via ${r.mech}.</div></details>`;
                    return `<details class="al bad card"><summary>Charges continue after inactivity · ${r.n}<span>Last use ${dt(x.u)} · ${x.n} charges since</span></summary><div class="ev">Last service activity: ${dt(x.u)}. Charges since: ${x.n}, totalling ₹${fmt(x.w)}. Estimated yearly waste if kept: ₹${fmt(r.annual)}.</div></details>`
                }).join('') : '<div class="card">No anomalies found.</div>') +
                    `<button class="pri" onclick="location.hash='recurring'">Open recurring payments to cancel</button>`
            },
            graph() {
                const W = 760, H = 520, cx = 380, cy = 260, n = recs.length, pos = recs.map((_, i) => { const a = i / n * 6.283 - 1.57; return [cx + 190 * Math.cos(a), cy + 150 * Math.sin(a), a] });
                const r = recs[S.g], p = pos[S.g], sat = [['Alias', r.descs[0], 'var(--mint)'], ['Mandate', 'MD' + S.g + ' · ' + r.freq, 'var(--sage)'], ['Mechanism', r.mech, '#FDE9B8'], ['Cancel path', CG[r.mech].where.split(',')[0].slice(0, 24), '#F6C5B8']];
                const sp = sat.map((s, k) => { const a = p[2] + (k - 1.5) * .5, d = 95; return [Math.min(W - 70, Math.max(70, p[0] + d * Math.cos(a))), Math.min(H - 24, Math.max(24, p[1] + d * Math.sin(a))), ...s] });
                const nd = (x, y, t, f, fn, rad = 26) => `<g class="node" ${fn ? `onclick="${fn}" tabindex="0"` : ''}><circle cx="${x}" cy="${y}" r="${rad}" fill="${f}" stroke="var(--side2)" stroke-width="1.5"/><text x="${x}" y="${y + 4}" font-size="10" text-anchor="middle" fill="#123C32" font-weight="600">${t}</text></g>`;
                return head('Payment Graph', 'Select a merchant to see how its mandate, alias and cancellation path connect.') + `<div class="g2"><div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Payment relationship graph">
 <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 0}" />${pos.map((q, i) => `<line x1="${cx}" y1="${cy}" x2="${q[0]}" y2="${q[1]}" stroke="${i == S.g ? 'var(--side2)' : 'var(--bd)'}" stroke-width="${i == S.g ? 2 : 1}"/>`).join('')}
 ${sp.map(s => `<line x1="${p[0]}" y1="${p[1]}" x2="${s[0]}" y2="${s[1]}" stroke="var(--side2)" stroke-dasharray="4 3"/>`).join('')}
 ${nd(cx, cy, 'You', '#A7F3D0', '', 30)}
 ${pos.map((q, i) => `<g class="node" onclick="S.g=${i};go()" tabindex="0" onkeydown="if(event.key=='Enter'){S.g=${i};go()}"><circle cx="${q[0]}" cy="${q[1]}" r="${i == S.g ? 24 : 19}" fill="${COL[i % COL.length]}"/><text x="${q[0]}" y="${q[1] + 4}" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">${recs[i].n[0]}</text><text x="${q[0]}" y="${q[1] + (q[1] > cy ? 36 : -28)}" font-size="10" text-anchor="middle" fill="var(--tx)">${recs[i].n.slice(0, 14)}</text></g>`).join('')}
 ${sp.map(s => `<g><rect x="${s[0] - 34}" y="${s[1] - 12}" width="68" height="24" rx="8" fill="${s[4]}" stroke="var(--side2)"/><text x="${s[0]}" y="${s[1] + 4}" font-size="9" text-anchor="middle" fill="#123C32">${s[2]}</text></g>`).join('')}</svg>
 <p class="sub" style="margin:6px 0 0">Graph is built from the detected payments. Use Export Cypher to load the same model into Neo4j.</p></div>
 <div class="card"><h3>${r.n}</h3>${[['Category', r.cat], ['Aliases', r.descs.length], ['Paid in 12 months', '₹' + fmt(r.a.reduce((s, t) => s + t.amt, 0))], ['Frequency', r.freq], ['Mechanism', r.mech], ['Alias text', r.descs.join(', ')]].map(x => `<div class="row"><span style="color:var(--mu)">${x[0]}</span><span style="text-align:right">${x[1]}</span></div>`).join('')}
 <p><button class="pri" onclick="openD(${S.g})">View cancellation guide</button> <button onclick="S.cy=!S.cy;go()">${S.cy ? 'Hide' : 'Export'} Cypher</button></p>${S.cy ? `<pre>${cypher()}</pre>` : ''}</div></div>`
            },
            annual() {
                const cats = {}; recs.forEach(r => cats[r.cat] = (cats[r.cat] || 0) + r.annual); const ce = Object.entries(cats).sort((a, b) => b[1] - a[1]), cc = ['#123C32', '#205747', '#4C8C6B', '#F59E0B', '#E76F51', '#A7F3D0']; let acc = 0;
                const cg = ce.map((c, i) => { const s = acc / total * 100; acc += c[1]; return `${cc[i % 6]} ${s}% ${acc / total * 100}%` }).join(',');
                return head('Annual Spending', 'What these commitments cost over a year.') + `<div class="g4"><div class="card kpi"><b>₹${fmt(total)}</b><span>Yearly commitment (≈ ₹${fmt(total / 12)} a month)</span></div><div class="card kpi"><b>₹${fmt(savings)}</b><span>Potential savings (${(savings / total * 100).toFixed(1)}%)</span></div><div class="card kpi"><b>${recs.length}</b><span>Recurring payments</span></div><div class="card kpi"><b>${ce.length}</b><span>Categories</span></div></div>
 <div class="g2"><div class="card"><h3>Monthly spend (recurring)</h3>${bars(monthly, MO)}<p class="sub" style="margin:6px 0 0">Quarterly premiums make some months taller.</p></div>
 <div class="card"><h3>Spend by category</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div role="img" aria-label="Category donut" style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${cg});-webkit-mask:radial-gradient(circle 40px,transparent 98%,#000 100%);mask:radial-gradient(circle 40px,transparent 98%,#000 100%)"></div><div>${ce.map((c, i) => `<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${cc[i % 6]};margin-right:6px"></span>${c[0]} ${Math.round(c[1] / total * 100)}%</div>`).join('')}</div></div></div></div>
 <div class="card tw"><h3>By merchant</h3><table><tbody>${[...recs].sort((a, b) => b.annual - a.annual).map(r => `<tr><td>${r.n}</td><td>${r.freq}</td><td style="text-align:right">₹${fmt(r.annual)} a year</td></tr>`).join('')}</tbody></table></div>`
            }
        };
        function cypher() { const c = ["MERGE (u:User {id:'U1'})", "MERGE (a:Account {id:'XX7421'})", "MERGE (u)-[:OWNS]->(a)"]; recs.forEach((r, i) => { c.push(`MERGE (m${i}:Merchant {name:'${r.n}'}) SET m${i}.category='${r.cat}'`, `MERGE (a)-[:HAS_MANDATE]->(d${i}:Mandate {id:'MD${i}', amount:${r.cur}, frequency:'${r.freq}'})-[:PAYS]->(m${i})`, `MERGE (k${i}:Mechanism {name:'${r.mech}'})`, `MERGE (d${i})-[:VIA]->(k${i})`, `MERGE (k${i})-[:CANCEL_VIA]->(:CancellationPath {mechanism:'${r.mech}'})`); r.descs.forEach(x => c.push(`MERGE (:MerchantAlias {text:'${x}'})-[:DECODES_TO]->(m${i})`)) }); return c.join(';\n') + ';' }
        function rows() {
            const q = S.q.toLowerCase(), L = recs.map((r, i) => [r, i]).filter(([r]) => (S.f == 'All' || st(r) == S.f) && (r.n + r.descs.join()).toLowerCase().includes(q));
            L.sort((x, y) => { const a = x[0], b = y[0], v = S.k == 'n' ? a.n.localeCompare(b.n) : S.k == 'last' ? a.last - b.last : a.cur - b.cur; return v * S.dir });
            $('#rows').innerHTML = L.length ? L.map(([r, i]) => `<tr class="r" onclick="openD(${i})" tabindex="0" onkeydown="if(event.key=='Enter')openD(${i})"><td>${av(r, i)}${r.n}</td><td>${r.descs[0]}</td><td>${Math.round(r.conf * 100)}%</td><td>₹${fmt(r.cur)}</td><td>${r.freq}</td><td>${r.mech}</td><td>${dt(r.last)}</td><td>${pill(r)}</td></tr>`).join('') : '<tr><td colspan="8">No payments match. Clear the search or filter.</td></tr>'
        }
        const $ = s => document.querySelector(s);
        function srt(k) { S.dir = S.k == k ? -S.dir : -1; S.k = k; rows() }
        function openD(i) {
            const r = recs[i], g = CG[r.mech], d = S.done[r.n] = S.done[r.n] || [];
            $('#dr').innerHTML = `<button onclick="$('#dr').classList.remove('o')" style="float:right">Close</button><h2 style="margin:0">${r.n}</h2><p class="sub">${r.cat} · ${r.freq} · ₹${fmt(r.cur)} · ${r.mech}</p>${pill(r)}
 <h3>Bank text seen</h3><p>${r.descs.join('<br>')}</p>${r.an.map(x => `<p><span class="pill rev">${label[x.t]}</span></p>`).join('')}
 <h3>How to cancel</h3><p class="sub" style="margin:0">Where: ${g.where}</p>${g.steps.map((s, k) => `<label class="step"><input type="checkbox" ${d.includes(k) ? 'checked' : ''} onchange="tick('${i}',${k})"> ${s}</label>`).join('')}
 <h3>If they don’t respond</h3><p>${g.esc}</p><p class="sub">Progress: ${d.length} of ${g.steps.length} steps</p>
 <button class="pri" ${d.length < g.steps.length || S.can[r.n] ? 'disabled' : ''} onclick="S.can['${r.n}']=1;openD(${i});go(1)">${S.can[r.n] ? 'Marked as cancelled' : 'Mark as cancelled'}</button>`; $('#dr').classList.add('o')
        }
        function tick(i, k) { const n = recs[i].n, d = S.done[n], x = d.indexOf(k); x < 0 ? d.push(k) : d.splice(x, 1); openD(+i) }
        function go(keep) {
            const h = (location.hash || '#overview').slice(1), p = P[h] ? h : 'overview';
            $('#nav').innerHTML = NAV.map(n => `<a href="#${n[0]}" class="${n[0] == p ? 'on' : ''}"><span>${n[1]}</span>${n[2]}</a>`).join('');
            $('#m').innerHTML = P[p](); if (p == 'recurring') rows(); if (!keep) $('#dr').classList.remove('o')
        }
        addEventListener('hashchange', () => go()); go();
    </script>
</body>

</html>
